name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks config is active (custom and default rules must fire on a probe)
        run: bash scripts/gitleaks-probe.sh "$GITLEAKS_IMAGE"
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner /repo
      - name: gitleaks (final tree, covers merge resolutions)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner /repo
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # corpus-runner tests read the pinned adapter commit from history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: install CI dependencies (hash-pinned)
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
      - name: embedded Python contracts parse and build
        run: python3 scripts/check_contracts.py
      - name: contract checker tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: install audio decoder for cache validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: weather-via-cli overlay tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/weather-via-cli
      - name: uniproxy-close-log overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/uniproxy-close-log
      - name: quasar-admission overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/quasar-admission -p "test_*.py"
      - name: quasar LAN proxy peer allow-list tests
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_quasar_lan_proxy
      - name: ac-defer-to-adapter overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/ac-defer-to-adapter
      - name: resource-bounds overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/resource-bounds
      - name: ha-intents-safety overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/ha-intents-safety
      - name: weather skill tests (adapter parser, runner and the quasar hand-over list)
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_weather_skills
      - name: cached remote announcement tests
        run: python3 -m unittest discover -s services/yandex-station/code -p "test_*announcement*.py"
      - name: stt-cli core from its hash pin (it must install and import, and the gateway glue must pass against the real core)
        working-directory: services/yandex-station/code
        run: |
          python3 -m pip install --require-hashes --no-deps -r requirements-stt-lib.txt
          python3 -c "import importlib.metadata as m, stt_cli.hypotheses.confusables; print('hyper-stt', m.version('hyper-stt'))"
          python3 -m unittest test_hypotheses_core_contract test_hypothesis_store test_second_opinion test_clip_hypotheses test_stt_hypotheses test_adapter_hypotheses
      - name: intent grammar, adapter route, timers, Home Assistant executors, Jev, nightly loop, utterance traces, session pages, clip feed, committed JSON bundle
        working-directory: services/yandex-station/code
        run: |
          python3 -m unittest test_intent_grammar test_intent_contexts test_correction_grammar test_correction test_correction_adapter test_intent_route test_timers test_ha_actions test_jev test_adapter_jev test_intent_nightly
          python3 -m unittest test_utterance_trace test_adapter_trace test_adapter_laya test_laya_quality test_classifier_journal test_session_pages test_clipfeed_diag test_clipfeed_tg test_correction_view test_wake_word test_stt_wake test_stt_asr_health test_wyoming_whisper_offload test_wake_window test_stt_wake_window test_bench_wake_window test_bench_confusables
          python3 -m unittest test_tone_guard test_hint_echo test_stt_lib_pin test_extra_dict test_extra_dict_dynamic test_stt_extra_dict test_bench_extra_dict
          python3 -m unittest test_bench_asr_archive asr_eval.test_asr_eval_tier_a asr_eval.test_asr_eval_tier_b asr_eval.test_asr_eval_tier_c asr_eval.test_asr_eval_batch asr_eval.test_asr_eval_latency
          python3 -m unittest test_info_intents test_capabilities test_ha_status test_home_status
          python3 -m unittest test_brain_line test_reply_guard test_clarify test_clarify_adapter
          python3 -m intent_grammar compile --check
      - name: Home Assistant client (mDNS discovery, standard sign-in, token refresh, the dashboard Connect page)
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_ha_client test_ha_connect
      - name: TV pause (the players of the activated speaker's room only, through the shared Home Assistant client, fake Home Assistant)
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_tvpause test_stt_tvpause
      - name: Home Assistant confirmed calls (fake Home Assistant over REST and WebSocket, incident replays, wording, logbook, isolated clip replay)
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_ha_verify test_ha_call test_ha_wording test_ha_logbook test_ha_trace_view test_ha_replay test_music_airplay_discovery
      - name: Claude cache and shared transport integration
        working-directory: services/yandex-station/code
        run: python3 -m unittest test_claude_cache_integration
      - name: quasar intent-grammar overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/intent-grammar -p "test_*.py"
      - name: quasar correction-hook overlay patch applier tests (the bun-driven hook behaviour tests skip without bun; run them locally)
        run: python3 -m unittest discover -s services/yandex-station/overlays/correction-hook -p "test_*.py"
      - name: quasar ha-verify-wording overlay patch applier tests
        run: python3 -m unittest discover -s services/yandex-station/overlays/ha-verify-wording -p "test_*.py"
      - name: failover watchdog component tests
        run: python3 -m unittest discover -s services/yandex-station/bluegreen -p "test_*.py"
      - name: quasar corpus runner rule tests (canned -> llm only for the emergency domain)
        run: node --test services/yandex-station/corpus-runner/*.test.mjs
      - name: isolated corpus evidence contracts (synthetic inputs only)
        run: python3 -m unittest discover -s services/yandex-station/corpus-runner -p "test_*.py"
  quasar-volume-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/yandex-station/overlays/volume-zero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "25.9.0"
          cache: npm
          cache-dependency-path: services/yandex-station/overlays/volume-zero/package-lock.json
      - name: install the exact regression dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: verify the recorded rejection and the zero-volume overlay
        run: npm run check
  whitespace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Diffing the whole tree against the empty tree treats every tracked file as added,
      # so --check flags whitespace errors anywhere, not only in this change: with the default
      # core.whitespace that is trailing whitespace, a space before a tab in the indent, and
      # blank lines at the end of a file.
      - name: no whitespace errors (git diff --check) in any tracked file
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
