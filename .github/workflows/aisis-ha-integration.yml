name: AISIS Home Assistant integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observed-volume:
    name: Real HA observed volume
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: services/yandex-station/homeassistant/requirements-ci.txt
      - name: Exercise the deployed coordinator and entity state
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          task_log="/tmp/aisis-ha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          exec > >(tee -a "$task_log") 2>&1
          task_started=$SECONDS
          trap 'rc=$?; printf "%s finished rc=%s elapsed=%ss log=%s\n" "$(date -Is)" "$rc" "$((SECONDS-task_started))" "$task_log"; exit "$rc"' EXIT
          printf '%s starting commit=%s log=%s\n' "$(date -Is)" "$(git rev-parse HEAD)" "$task_log"
          python3 -m pip install -r services/yandex-station/homeassistant/requirements-ci.txt
          python3 -m pip freeze
          PYTHONPATH="$PWD/services/yandex-station/homeassistant" python3 -m unittest discover -v \
            -s services/yandex-station/homeassistant/tests -p 'test_*.py'
