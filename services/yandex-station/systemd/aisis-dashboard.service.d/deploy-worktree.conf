# Drop-in for aisis-dashboard.service: run the code from the dedicated deployment worktree (branch deploy-main, fast-forwarded to origin/main)
# instead of the shared primary checkout, which agents may not change and which can hold unreviewed edits.
[Service]
ExecStart=
ExecStart=%h/.local/share/aisis/venv/bin/python %h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code/dashboard.py
