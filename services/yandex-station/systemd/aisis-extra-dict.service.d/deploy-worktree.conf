# Drop-in for aisis-extra-dict.service: run the refresh from the dedicated deployment worktree (branch deploy-main, fast-forwarded to origin/main)
# instead of the shared primary checkout, which agents may not change and which can hold unreviewed edits.
[Service]
WorkingDirectory=%h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code
ExecStart=
ExecStart=%h/.local/share/aisis/venv/bin/python %h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code/extra_dict_dynamic.py refresh
