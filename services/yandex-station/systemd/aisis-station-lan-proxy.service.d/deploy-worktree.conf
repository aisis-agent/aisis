# Drop-in for aisis-station-lan-proxy.service: run the code from the dedicated deployment worktree (branch deploy-main, fast-forwarded to origin/main)
# instead of the shared primary checkout, which agents may not change and which can lag behind main (the ALLOWED_PEERS allow-list lives in main).
[Service]
ExecStart=
ExecStart=%h/.local/share/aisis/venv/bin/python %h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code/quasar_lan_proxy.py
