# Drop-in for aisis-station-pm.service: run the code from the dedicated deployment worktree (branch deploy-main, fast-forwarded to origin/main)
# instead of the shared primary checkout, which agents may not change and which can lag behind main.
# Machine-local drop-ins that only add conditions (an operator's stop marker) are unaffected: they do not set ExecStart.
[Service]
WorkingDirectory=%h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code
ExecStart=
ExecStart=%h/.local/share/agent-tools/chatgpt-guardian-venv/bin/python %h/xp/aisis/.worktrees/deploy-main/services/yandex-station/code/pm_cdp_server.py
