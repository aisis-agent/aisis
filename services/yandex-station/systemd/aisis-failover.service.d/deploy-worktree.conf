# Drop-in for aisis-failover.service: run the watchdog from the dedicated deployment worktree (branch deploy-main, fast-forwarded to origin/main)
# instead of the shared primary checkout, which agents may not change and which can lag behind main.
#
# A machine-local drop-in that wraps the watchdog in a launcher (front-exclude.conf: failover-exclude.py, which leaves out the components of another
# host) sorts after this one and replaces ExecStart; zz-launcher-bluegreen-dir.conf then makes that launcher read the same directory.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 %h/xp/aisis/.worktrees/deploy-main/services/yandex-station/bluegreen/failover.py --env prod
