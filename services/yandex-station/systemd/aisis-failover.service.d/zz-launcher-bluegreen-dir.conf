# Drop-in for aisis-failover.service: the directory a launcher around the watchdog loads failover.py from (AISIS_BLUEGREEN_DIR) is the
# deployment worktree that deploy-worktree.conf runs the watchdog from, whatever directory the launcher's own drop-in fixed.
#
# Why a second file: the host's front-exclude.conf is rendered from the unit's ExecStart of that moment and sets this variable itself; it sorts
# AFTER deploy-worktree.conf, so its ExecStart wins (that is intended: the exclusions must stay) and a variable it fixed to the primary checkout
# would make the launcher run the primary checkout's code while the unit looks moved. This file sorts after it (and before the operator's
# zz-operator-* pauses, which only replace ExecStart), so the later assignment wins. It never sets ExecStart: that would undo the exclusions.
# Keep the directory in step with deploy-worktree.conf (scripts/test_install_systemd_units.py checks it).
[Service]
Environment=AISIS_BLUEGREEN_DIR=%h/xp/aisis/.worktrees/deploy-main/services/yandex-station/bluegreen
