# Temp audio of the recognizer on the real disk, never on /tmp.
# wyoming_faster_whisper writes every utterance to a temporary WAV (tempfile + wave). /tmp here is a tmpfs with a per-user
# byte quota (usrquota, about 24 GiB for ~31 GiB of tmpfs) shared with every build, test run and agent scratch dir of the
# user. On 2026-11-17 that quota filled up: each transcription died with `OSError: [Errno 122] Disk quota exceeded` in
# wave.py and the client received an invalid header, while the process stayed up and kept answering Describe.
# CacheDirectory= creates ~/.cache/aisis-asr-tmp (mode 0700) at every start (user manager: $XDG_CACHE_HOME); TMPDIR is
# what Python's tempfile reads. The ExecStartPre sweeps what a killed process left behind (nothing uses the directory
# while the unit is stopped); the leading `-` keeps an empty or missing directory from failing the start.
[Service]
CacheDirectory=aisis-asr-tmp
CacheDirectoryMode=0700
Environment=TMPDIR=%C/aisis-asr-tmp
ExecStartPre=-/usr/bin/find %C/aisis-asr-tmp -mindepth 1 -delete
